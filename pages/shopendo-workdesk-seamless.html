<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f6f7f1" />
  <title>Shopendo — The Commerce Workdesk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --page:#e6e8e1; --surface:#f8f9f4; --sidebar:#f1f3eb; --top:#f8f9f4;
      --text:#1b2420; --sub:#6c7670; --line:#dce0d8; --line-dark:#b8c0b8;
      --accent:#d9f17e; --accent-ink:#243128; --panel:#ffffff;
      --chip:#e8ebe3; --hover:#e9ede3; --shadow:0 24px 80px rgba(39,51,41,.08);
      --orange:#ebbb9e; --mint:#d9efc9; --inkcard:#23302c;
    }
    body[data-theme="dark"] {
      --page:#0d1412; --surface:#17201c; --sidebar:#121a17; --top:#17201c;
      --text:#f2f3e9; --sub:#a0aca2; --line:#344139; --line-dark:#59655d;
      --accent:#dcf584; --accent-ink:#1c291e; --panel:#212b25;
      --chip:#27342d; --hover:#26342c; --shadow:0 32px 90px rgba(0,0,0,.24);
      --orange:#be8e76; --mint:#a6c59a; --inkcard:#24352e;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--page);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;letter-spacing:-.025em;transition:background .35s,color .35s}
    button,input,a,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8cae4c;outline-offset:4px}
    a{text-decoration:none;color:inherit}
    ::selection{background:var(--accent);color:var(--accent-ink)}
    .mono{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
    .app-shell{display:grid;grid-template-columns:236px minmax(0,1fr);max-width:1920px;min-height:calc(100vh - 28px);margin:14px auto;background:var(--surface);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow);overflow:hidden;transition:background .35s}
    .sidebar{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:calc(100vh - 28px);position:relative;z-index:4}
    .brand{padding:29px 24px 31px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
    .logo-mark{height:35px;width:35px;position:relative;flex:none}
    .logo-mark span{position:absolute;inset:4px;background:var(--text);border-radius:7px;transform:rotate(-24deg);}
    .logo-mark span:nth-child(2){inset:10px 1px 1px 10px;background:var(--accent);border:2px solid var(--sidebar)}
    .logo-mark span:nth-child(3){inset:14px 7px 7px 14px;background:var(--text);border-radius:3px;transform:rotate(-24deg)}
    .brand-name{font-size:21px;letter-spacing:-1.25px;font-weight:800;line-height:1}
    .brand-caption{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--sub);margin-top:6px;font-family:'DM Mono',monospace}
    .side-scroll{overflow-y:auto;padding:25px 13px 20px;flex:1;scrollbar-width:thin}
    .section-label{font:10px 'DM Mono',monospace;color:var(--sub);letter-spacing:.1em;padding:0 13px;margin:12px 0 13px}
    .menu-item{display:flex;align-items:center;gap:12px;width:100%;border:0;text-align:left;background:transparent;color:var(--sub);padding:11px 12px;border-radius:10px;min-height:46px;margin:3px 0;font-size:13px;font-weight:600;letter-spacing:-.02em;transition:all .2s;position:relative}
    .menu-item:hover{background:var(--hover);color:var(--text);transform:translateX(2px)}
    .menu-item.active{background:var(--text);color:var(--sidebar)}
    .menu-item.active .menu-icon{color:var(--accent)}
    .menu-icon{width:20px;display:inline-flex;justify-content:center;align-items:center;flex-shrink:0}
    .menu-item .mini-arrow{margin-left:auto;opacity:.55;display:flex}
    .menu-item.active .mini-arrow{opacity:.85}
    .menu-divider{height:1px;background:var(--line);margin:22px 12px}
    .side-bottom{padding:16px 15px 19px;border-top:1px solid var(--line);display:grid;gap:15px}
    .switcher{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 10px;border-radius:11px;text-align:left;transition:background .2s}
    .switcher:hover{background:var(--hover)}
    .store-avatar{width:34px;height:34px;background:#302a26;border-radius:9px;color:#fbe4cf;display:grid;place-items:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;flex:none}
    .store-details{min-width:0;flex:1}
    .store-details strong{font-size:12px;display:block;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .store-details small{font-size:10px;color:var(--sub);display:block;margin-top:2px}
    .theme-row{display:flex;align-items:center;justify-content:space-between;padding:1px 4px 0}
    .theme-pill{display:flex;gap:2px;background:var(--chip);padding:4px;border-radius:99px}
    .theme-pill button{border:0;background:none;color:var(--sub);border-radius:99px;width:33px;height:28px;display:grid;place-items:center;transition:.2s}
    .theme-pill button.selected{background:var(--panel);color:var(--text);box-shadow:0 1px 5px #00000012}
    .side-caption{font-size:10px;color:var(--sub)}
    .main{min-width:0;position:relative;display:flex;flex-direction:column}
    .topbar{height:78px;flex:none;display:flex;align-items:center;gap:15px;justify-content:space-between;padding:0 40px;border-bottom:1px solid var(--line);background:var(--top);z-index:3}
    .breadcrumb{font-size:11px;display:flex;align-items:center;gap:10px;letter-spacing:.04em;color:var(--sub);font-family:'DM Mono',monospace;text-transform:uppercase}
    .breadcrumb strong{font-weight:500;color:var(--text)}
    .crumb-square{height:7px;width:7px;background:var(--accent);border:1px solid var(--text);transform:rotate(45deg);margin-right:5px}
    .top-actions{display:flex;align-items:center;gap:11px}
    .key-search{display:flex;align-items:center;justify-content:space-between;gap:20px;min-width:248px;background:var(--chip);color:var(--sub);border:1px solid var(--line);padding:10px 12px;border-radius:10px;font-size:12px;text-align:left}
    .key-search span:first-child{display:flex;gap:9px;align-items:center}
    .keyboard{border:1px solid var(--line-dark);padding:3px 5px;border-radius:4px;font:10px 'DM Mono',monospace;color:var(--sub)}
    .icon-btn{display:grid;place-items:center;width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line);color:var(--text);background:transparent;transition:.2s}
    .icon-btn:hover{background:var(--hover)}
    .profile{width:37px;height:37px;display:grid;place-items:center;border-radius:50%;background:#e5c7a6;color:#4c3021;font-weight:800;font-size:12px;border:2px solid var(--panel)}
    .content{padding:37px 43px 40px;overflow:auto;flex:1}
    .heading-top{display:flex;align-items:center;justify-content:space-between;gap:20px}
    .overline{display:flex;align-items:center;gap:10px;font-family:'DM Mono',monospace;text-transform:uppercase;color:var(--sub);letter-spacing:.095em;font-size:11px}
    .dash-indicator{width:19px;height:2px;background:var(--text)}
    .mode-chip{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--sub);font-family:'DM Mono',monospace;letter-spacing:.04em}
    .mode-chip i{height:7px;width:7px;border-radius:50%;background:#a4ca70;box-shadow:0 0 0 4px #a4ca7025}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) 302px;align-items:end;gap:30px;margin-top:19px;margin-bottom:36px}
    .hero h1{font-weight:600;font-size:clamp(47px,5vw,79px);line-height:.99;letter-spacing:-.083em;margin:0 0 21px;max-width:800px}
    .hero h1 em{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.055em;color:#78943e;white-space:nowrap}
    body[data-theme="dark"] .hero h1 em{color:var(--accent)}
    .hero p{color:var(--sub);font-size:14px;line-height:1.65;letter-spacing:-.01em;margin:0;max-width:530px}
    .hero-side{border-top:1px solid var(--line-dark);padding-top:15px;position:relative}
    .hero-side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;color:var(--sub)}
    .hero-side strong{font-size:18px;line-height:1.3;letter-spacing:-.05em;font-weight:600;display:block;max-width:200px}
    .arrow-button{height:45px;width:45px;border:1px solid var(--line-dark);background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--text);position:absolute;right:0;bottom:0;transition:.25s}
    .arrow-button:hover{background:var(--accent);color:var(--accent-ink);transform:rotate(-45deg)}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .section-head h2{font:11px 'DM Mono',monospace;letter-spacing:.07em;text-transform:uppercase;margin:0;font-weight:500;color:var(--sub)}
    .section-head-right{color:var(--sub);font-size:11px;display:flex;align-items:center;gap:12px}
    .section-head-right .line{width:50px;height:1px;background:var(--line-dark)}
    .work-grid{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,.94fr);grid-template-rows:252px 252px;gap:14px}
    .work-card{border:0;display:block;position:relative;overflow:hidden;text-align:left;border-radius:13px;transition:transform .3s,box-shadow .3s;isolation:isolate;padding:24px 26px;min-width:0;width:100%}
    .work-card:hover{transform:translateY(-5px);box-shadow:0 20px 40px #00000018}
    .work-card:focus-visible{outline-offset:4px}
    .work-card .topline{display:flex;align-items:center;gap:9px;position:relative;z-index:2;font:10px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
    .work-card .topline .number{border:1px solid currentColor;border-radius:5px;padding:5px 6px;opacity:.75}
    .work-card h3{position:relative;z-index:2;line-height:.94;letter-spacing:-.075em;font-size:clamp(27px,3.6vw,56px);font-weight:600;margin:39px 0 12px}
    .work-card h3 em{font:italic 1.14em 'Instrument Serif',serif;letter-spacing:-.06em}
    .work-card p{position:relative;z-index:2;letter-spacing:-.01em;font-size:12px;line-height:1.5;max-width:220px;margin:0;opacity:.76}
    .work-card .action-circle{width:45px;height:45px;display:grid;place-items:center;border-radius:50%;border:1px solid currentColor;position:absolute;bottom:23px;right:24px;z-index:5;transition:transform .25s,background .25s}
    .work-card:hover .action-circle{transform:rotate(-45deg);background:#ffffff22}
    .card-footer{position:absolute;bottom:26px;left:26px;z-index:3;font:10px 'DM Mono',monospace;letter-spacing:.07em}
    .manage{grid-row:span 2;background:var(--inkcard);color:#f1f2e7}
    .manage .topline{color:#daeab8}
    .manage h3{font-size:clamp(48px,5.2vw,81px);margin-top:70px;max-width:360px}
    .manage p{max-width:230px;color:#d9e2da}
    .manage .card-footer{color:#b1c3b7}
    .manage::after{content:'';position:absolute;border:1px solid #58685c;border-radius:50%;width:510px;height:510px;right:-310px;top:-160px;box-shadow:0 0 0 32px #ffffff04,0 0 0 67px #ffffff05,0 0 0 111px #ffffff03}
    .store-art{position:absolute;width:295px;height:343px;right:-34px;top:126px;transform:rotate(-10deg);border-radius:12px;background:#e7eddf;box-shadow:0 28px 45px #00000050;z-index:1;border:5px solid #d6e0d3;overflow:hidden}
    .store-art .art-top{height:36px;background:#f8faf5;border-bottom:1px solid #cad2c6;display:flex;align-items:center;gap:5px;padding:0 12px}
    .store-art .art-top span{height:6px;width:6px;border-radius:50%;background:#a6b4a4}
    .art-body{display:grid;grid-template-columns:61px 1fr;height:calc(100% - 36px)}
    .art-nav{background:#dce6d8;padding:18px 11px}
    .art-nav i{display:block;height:6px;width:100%;border-radius:4px;background:#b3c5ac;margin-bottom:19px}
    .art-nav i:first-child{background:#637e6b;height:27px;border-radius:5px}
    .art-screen{padding:24px 18px}
    .art-screen .block{height:13px;width:70%;background:#879b86;border-radius:4px;margin-bottom:12px}
    .art-screen .small{height:7px;width:90%;background:#c1d1bf;border-radius:3px;margin-bottom:26px}
    .art-screen .big{height:95px;width:100%;border-radius:6px;background:#b4cdb2;margin-bottom:13px;display:flex;align-items:flex-end;padding:10px;gap:9px}
    .art-screen .big b{display:block;background:#5b7d61;width:18px;border-radius:2px}
    .art-screen .big b:nth-child(1){height:30%}.art-screen .big b:nth-child(2){height:65%}.art-screen .big b:nth-child(3){height:44%}.art-screen .big b:nth-child(4){height:86%}.art-screen .big b:nth-child(5){height:58%}
    .art-row{height:12px;background:#dae5d5;border-radius:4px;margin-bottom:9px}
    .art-float{position:absolute;z-index:3;top:136px;right:29px;transform:rotate(12deg);background:var(--accent);color:#273326;border-radius:8px;padding:12px 16px;box-shadow:0 9px 30px #0002;font:11px 'DM Mono',monospace;letter-spacing:0}
    .edit{background:var(--orange);color:#2f2927}
    .edit h3,.reports h3{margin-top:32px;font-size:clamp(32px,3.4vw,53px)}
    .edit p,.reports p{display:none}
    .edit-art{position:absolute;width:191px;height:154px;right:17px;top:74px;z-index:1;transform:rotate(9deg);background:#fff9ef;border:5px solid #312d2a;border-radius:7px;overflow:hidden;box-shadow:12px 15px 0 #a77f70}
    .edit-art .browser{height:21px;background:#302a27;display:flex;align-items:center;padding-left:8px;gap:4px}
    .edit-art .browser span{height:5px;width:5px;background:#c6c5b9;border-radius:50%}
    .edit-art .poster{height:100%;background:#f4f1e9;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:12px}
    .edit-art .poster .poster-type{font:bold 17px/.95 'Instrument Serif',serif;padding-top:9px;color:#252620}
    .edit-art .poster .poster-type i{display:block;width:57px;height:4px;background:#a7b0a0;margin-top:9px}
    .edit-art .poster .poster-shape{position:relative;border-radius:60px 60px 3px 3px;background:#dfad85;overflow:hidden}
    .edit-art .poster .poster-shape:before{content:'';position:absolute;width:60px;height:68px;background:#546c53;border-radius:50%;top:37px;left:-22px}
    .edit-art .poster .poster-shape:after{content:'';position:absolute;width:55px;height:79px;background:#aa6f62;border-radius:50%;top:14px;right:-30px}
    .reports{background:var(--accent);color:#253127}
    .reports::before{content:'✳';position:absolute;font-size:180px;font-weight:400;right:0;top:-50px;opacity:.12;z-index:0;line-height:1}
    .chart-art{position:absolute;z-index:1;bottom:24px;right:28px;width:54%;height:123px;overflow:visible}
    .chart-art path{stroke:#293b29;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .chart-art .thin{stroke:#42594350;stroke-width:1;stroke-dasharray:4 6}
    .chart-art circle{fill:#26372b;stroke:var(--accent);stroke-width:4}
    .utility-section{margin-top:34px}
    .utility-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .utility{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:19px 17px;min-height:147px;display:flex;flex-direction:column;text-align:left;justify-content:space-between;transition:.2s;position:relative;overflow:hidden}
    .utility:hover{border-color:var(--line-dark);transform:translateY(-3px);background:var(--hover)}
    .utility .util-icon{width:31px;height:31px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center}
    .utility strong{font-size:14px;font-weight:700;letter-spacing:-.04em;display:block;margin-bottom:4px}
    .utility small{font-size:11px;line-height:1.4;color:var(--sub);letter-spacing:-.01em}
    .util-arrow{position:absolute;top:21px;right:17px;opacity:.45}
    .footer-note{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:29px 0 2px;font:10px 'DM Mono',monospace;letter-spacing:.03em;color:var(--sub)}
    .footer-note span:last-child{display:flex;align-items:center;gap:7px}
    .footer-note i{width:6px;height:6px;border-radius:50%;background:#a3cc70}
    .workspace{animation:appear .32s ease}
    @keyframes appear{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    .workspace-header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:16px 0 23px}
    .workspace-heading{font-size:clamp(48px,5vw,76px);line-height:.96;font-weight:600;letter-spacing:-.08em;margin:19px 0 12px}
    .workspace-heading em{font:italic 1.12em 'Instrument Serif',serif;letter-spacing:-.06em;color:#81993e}
    body[data-theme="dark"] .workspace-heading em{color:var(--accent)}
    .workspace-sub{color:var(--sub);max-width:610px;line-height:1.6;font-size:13px;letter-spacing:0}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-dark);background:transparent;color:var(--text);border-radius:9px;font-weight:700;font-size:12px;min-height:40px;padding:0 14px;white-space:nowrap;transition:.2s}
    .btn:hover{background:var(--hover)}
    .btn.dark{background:var(--text);color:var(--surface);border-color:var(--text)}
    .btn.dark:hover{opacity:.82}
    .btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
    .btn.accent:hover{filter:brightness(.94)}
    
    
    
    
    
    
    
    
    
    .frame-left h3{font-size:clamp(35px,3.4vw,57px);line-height:.98;letter-spacing:-.075em;margin:20px 0}
    .frame-left h3 em{font:italic 1.13em 'Instrument Serif',serif}
    .frame-left p{color:#b5c1b5;font-size:13px;line-height:1.6;max-width:290px}
    
    
    
    
    
    .diag-connector:after{content:'';position:absolute;bottom:0;left:-3px;width:7px;height:7px;border-right:1px solid var(--line-dark);border-bottom:1px solid var(--line-dark);transform:rotate(45deg)}
    .frame-right p{color:var(--sub);font-size:12px;line-height:1.55}
    .frame-right .btn{margin-top:7px;align-self:flex-start}
    .tabs{display:flex;align-items:center;gap:7px;max-width:100%;overflow-x:auto;padding:13px 40px;border-bottom:1px solid var(--line);background:var(--surface);scrollbar-width:none}
    .tabs:empty{display:none}
    .tab{display:flex;align-items:center;gap:7px;flex:none;padding:7px 12px;background:var(--chip);border-radius:7px;border:1px solid transparent;color:var(--sub);font-size:11px;font-weight:700;cursor:pointer}
    .tab.active{background:var(--text);color:var(--surface)}
    .tab-close{opacity:.7;margin-left:7px;border:0;background:transparent;color:inherit;padding:1px;display:grid;place-items:center}
    .back-arrow{display:grid;place-items:center;border:0;background:transparent;color:var(--sub);margin-right:3px}
    .info-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:17px}
    .big-panel,.small-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px}
    .panel-eyebrow{font:10px 'DM Mono',monospace;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
    .big-panel h3,.small-panel h3{font-size:25px;letter-spacing:-.06em;font-weight:600;margin:19px 0 10px}
    .big-panel p,.small-panel p{font-size:13px;line-height:1.65;color:var(--sub)}
    .setting-line{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:17px 0;font-size:13px}
    .setting-line:last-child{border-bottom:0}
    .setting-line strong{font-size:13px}
    .setting-line small{display:block;color:var(--sub);margin-top:5px;font-size:11px;line-height:1.45}
    .tag{font:10px 'DM Mono',monospace;border:1px solid var(--line);border-radius:6px;padding:7px 9px;white-space:nowrap;background:var(--sidebar)}
    .copy-field{display:flex;align-items:center;gap:10px;background:var(--sidebar);border:1px solid var(--line);border-radius:9px;padding:10px 10px 10px 14px;margin:22px 0;max-width:500px}
    .copy-field code{font:13px 'DM Mono',monospace;flex:1;word-break:break-all}
    .faq{border-top:1px solid var(--line);margin-top:24px}
    .faq details{border-bottom:1px solid var(--line);padding:19px 3px}
    .faq summary{cursor:pointer;font-size:14px;font-weight:700}
    .faq p{max-width:650px}
    .plan-ticket{background:var(--accent);color:var(--accent-ink);border-radius:11px;padding:24px;margin-top:18px}
    .plan-ticket .big{font-size:41px;line-height:1.1;letter-spacing:-.07em;margin:28px 0 5px;font-weight:600}
    .form-group{margin:20px 0}
    .form-group label{font-size:12px;font-weight:700;display:block;margin-bottom:8px}
    .form-group input{padding:12px;background:var(--surface);border:1px solid var(--line-dark);border-radius:8px;color:var(--text);width:100%;max-width:480px;outline-color:#abc36c}
    .toggle{width:43px;height:25px;border:0;background:var(--line-dark);padding:3px;border-radius:99px;position:relative;flex:none}

/* === Shopendo seamless workspaces: app screens ARE page content, not frames === */
.content.native-mode{padding:0;overflow:auto;background:var(--surface)}
.content.native-mode>.native-workspace{min-height:calc(100vh - 150px);animation:appear .23s ease}

.native-identity strong{font-size:14px;letter-spacing:-.035em;display:block;white-space:nowrap}

.native-right{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.native-topnav{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding:0 36px;overflow-x:auto;scrollbar-width:none;background:var(--surface)}
.native-nav-btn{border:0;border-bottom:2px solid transparent;color:var(--sub);background:transparent;padding:17px 15px 15px;font-size:12px;font-weight:600;white-space:nowrap;transition:.2s}
.native-nav-btn:hover{color:var(--text)}

.native-body{padding:33px 40px 50px;max-width:1510px;margin:0 auto}
.native-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:10px 0 27px}
.native-kicker{color:var(--sub);font:10px 'DM Mono',monospace;letter-spacing:.11em;text-transform:uppercase;display:flex;align-items:center;gap:10px}

function payloadEditor(){return `<div class="payload-crumb">COLLECTIONS ${icon('arrowRight',12)} PAGES ${icon('arrowRight',12)} <strong>HOME</strong></div><h1 class="payload-editor-title">Home page<span style="color:#91af56">.</span></h1><div class="payload-editor-meta"><span class="state-pill ${payloadPublished?'positive':'warning'}" id="publish-status">${payloadPublished?'Published':'Draft'}</span><span>Last edited just now · Local preview state</span></div><div class="payload-columns"><div class="payload-edit-panel"><span class="panel-eyebrow">CONTENT DETAILS</span><div class="native-field" style="margin-top:23px">Page title<input data-payload-text="title" value="${escapeHTML(payloadState.title)}" /><small class="native-help">Only used inside this prototype.</small></div><div class="native-field">Slug<input data-payload-text="slug" value="${escapeHTML(payloadState.slug)}" /></div><div class="panel-eyebrow" style="margin:32px 0 15px">CONTENT BLOCKS / CLICK TO EDIT</div>${[['hero','Hero banner','Your storefront’s first impression','layers'],['featured','Featured collections','What shoppers discover next','grid'],['announcement','Announcement bar','Top-of-site message','spark']].map(b=>`<button class="payload-block ${payloadBlock===b[0]?'selected':''}" data-payload-block="${b[0]}"><span class="block-icon">${icon(b[3],17)}</span><span><strong>${b[1]}</strong><small>${b[2]}</small></span><span class="block-arrow">${icon('arrowRight',15)}</span></button>`).join('')}<div id="payload-block-fields" style="margin-top:30px">${payloadFields()}</div></div>${payloadPreview()}</div>`}

function payloadCollectionPage(){const label=payloadCollection==='media'?'Media library':payloadCollection==='navigation'?'Navigation': 'Global settings';return `<div class="payload-crumb">PAYLOAD CMS ${icon('arrowRight',12)} <strong>${label.toUpperCase()}</strong></div><h1 class="payload-editor-title">${label}<span style="color:#91af56">.</span></h1><p style="font-size:13px;color:var(--sub);line-height:1.65;margin-bottom:28px">Organize and edit ${label.toLowerCase()} without an embedded frame or a second theme.</p><div class="payload-list">${(payloadCollection==='media'?[['Hero image','Main homepage visual','grid'],['Brand assets','Logo and design elements','layers'],['Product imagery','Shared storefront media','package']]:payloadCollection==='navigation'?[['Header navigation','Primary storefront menu','layers'],['Footer links','Links and information','globe']]:[['Brand settings','Global identity','settings'],['Store information','Business-facing content','globe']]).map(x=>`<button data-toast="Design-only item: connect your Payload collection to edit ${x[0]}." ><span class="native-symbol">${icon(x[2],18)}</span><span><strong>${x[0]}</strong><small>${x[1]}</small></span><span style="margin-left:auto">${icon('arrowRight',17)}</span></button>`).join('')}</div>`}
function payloadPage(){return `<section class="native-workspace">${nativeToolbar('cms',`<button class="native-btn" data-toast="This preview is built directly in HTML, not an iframe.">${icon('external',15)} Preview</button><button class="native-btn lime" data-publish="1">${icon('check',16)} ${payloadPublished?'Update':'Publish'} changes</button>`)}<div class="payload-layout">${payloadLeft()}<main class="payload-canvas">${payloadCollection==='pages'?payloadEditor():payloadCollectionPage()}</main></div></section>`}
const reportSets={
 '7D':{total:'₹48,620',change:'+8.2%',period:'Oct 18 – Oct 24, 2026',values:[16,29,21,32,31,43,50],orders:94,average:'₹517',conversion:'3.8%'},
 '30D':{total:'₹2,14,860',change:'+12.6%',period:'Sep 25 – Oct 24, 2026',values:[12,20,15,25,17,31,26,34,26,42,37,52,46,38,57,52,60,54,67,61,76,69,73,87,83,95,88,101,93,111],orders:426,average:'₹504',conversion:'3.5%'},
 '90D':{total:'₹6,82,450',change:'+17.3%',period:'Jul 27 – Oct 24, 2026',values:[22,24,20,28,30,29,36,38,34,40,43,40,44,50,48,53,51,59,62,57,65,69,66,71],orders:1304,average:'₹523',conversion:'3.7%'}

function reportChart(){const values=reportSets[reportRange].values;const max=Math.max(...values)*1.16;const pts=values.map((y,i)=>[(i/(values.length-1))*100,170-y/max*143]);const line=pts.map((p,i)=>`${i?'L':'M'} ${p[0].toFixed(2)} ${p[1].toFixed(2)}`).join(' ');const area=line+' L 100 170 L 0 170 Z';const last=pts.at(-1);return `<svg class="report-svg" role="img" aria-label="Illustrative revenue trend line for ${reportRange}, not actual sales" viewBox="0 0 100 190" preserveAspectRatio="none"><defs><linearGradient id="chartFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9f17e" stop-opacity=".34"/><stop offset="1" stop-color="#d9f17e" stop-opacity="0"/></linearGradient></defs>${[30,65,100,135,170].map(y=>`<line x1="0" y1="${y}" x2="100" y2="${y}" stroke="#ffffff" stroke-opacity=".12" stroke-width=".23" stroke-dasharray="1 1.4"/>`).join('')}<path d="${area}" fill="url(#chartFade)"/><path d="${line}" fill="none" stroke="#d9f17e" stroke-width=".9" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="1.2" fill="#d9f17e" stroke="#23302c" stroke-width=".55"/></svg>`}
function reportsPage(){const r=reportSets[reportRange];return `<section class="native-workspace">${nativeToolbar('reports',`<button class="native-btn" data-toast="The sample chart cannot export real business data.">${icon('arrowUpRight',15)} Export report</button>`)}<div class="native-body">${heading('ANALYTICS / DEMONSTRATION','Find the <em>signals.</em>','Your reporting application lives directly in the Shopendo workspace.',`<div class="report-periods" aria-label="Reporting period">${['7D','30D','90D'].map(x=>`<button class="${reportRange===x?'active':''}" data-report-range="${x}" aria-pressed="${reportRange===x}">${x}</button>`).join('')}</div>`)}
<div class="report-hero"><div class="report-hero-top"><div><div class="mono">REVENUE / ILLUSTRATIVE CHART</div><div class="report-total">${r.total}<small>${r.change} ↗</small></div></div><span class="native-badge" style="background:#425444;color:#ebf5db"><i></i> SAMPLE DATA / ${reportRange}</span></div>${reportChart()}<div class="report-meta"><span>START &nbsp; / &nbsp; ${r.period.split(' – ')[0]}</span><span>END &nbsp; / &nbsp; ${r.period.split(' – ')[1]}</span></div></div>
<div class="report-grid"><div class="report-detail"><div class="mono">ORDERS / DEMO</div><strong>${r.orders.toLocaleString()}</strong><small>Sample completed orders</small></div><div class="report-detail"><div class="mono">AVERAGE ORDER / DEMO</div><strong>${r.average}</strong><small>Illustrative order value</small></div><div class="report-detail"><div class="mono">CONVERSION / DEMO</div><strong>${r.conversion}</strong><small>Example conversion rate</small></div></div><div class="footer-note"><span>RECHARTS + SHADCN STYLING TARGET / THIS STANDALONE DEMO USES SVG</span><span>SAMPLE DATA ONLY</span></div></div></section>`}
function workspaceApp(id){return id==='manage'?medusaPage():id==='cms'?payloadPage():reportsPage()}
function openProductSheet(productName=''){
  document.querySelector('#modal-root').innerHTML=`<div class="sheet-scrim" data-sheet-scrim><aside class="sheet" role="dialog" aria-modal="true" aria-label="Product details"><div class="sheet-head"><span class="native-kicker">MEDUSA / CATALOG</span><button class="native-btn" data-close-sheet aria-label="Close product editor">${icon('close',16)}</button></div><h2>${productName?'Edit product':'Create a product.'}</h2><p>A quick interactive product panel. Save adds an item to the local demo list; it does not modify your Medusa backend.</p><form id="demo-product-form"><label class="native-field">Product name<input id="demo-product-name" required maxlength="70" value="${escapeHTML(productName)}" placeholder="e.g. Cardamom bun"/></label><label class="native-field">SKU<input id="demo-product-sku" required maxlength="24" value="BS-NEW-001"/></label><label class="native-field">Price (₹)<input id="demo-product-price" type="number" min="1" required value="390"/></label><div class="sheet-actions"><button class="native-btn" type="button" data-close-sheet>Cancel</button><button class="native-btn primary" type="submit">${productName?'Save changes':'Create demo product'} ${icon('arrowRight',16)}</button></div></form></aside></div>`;
  document.querySelector('#demo-product-name').focus();
}
function staticHeading(kicker,title,italic,desc){return `<div class="overline"><i class="dash-indicator"></i> ${kicker}</div><div class="workspace-header"><div><h1 class="workspace-heading">${title} <em>${italic}</em></h1><p class="workspace-sub">${desc}</p></div><button class="btn" data-nav="home">${icon('arrowLeft',16)} Back to desk</button></div>`}
function domainPage(){return `<section class="workspace">${staticHeading('SETUP / 01','Store','domain.','Your storefront deserves an address people remember. Manage it here.')}
  <div class="info-layout"><div class="big-panel"><span class="panel-eyebrow">YOUR STOREFRONT ADDRESS</span><h3>BakeStakes on the web.</h3><p>This demo shows the storefront URL supplied for your store. DNS verification is not performed in this prototype.</p><div class="copy-field"><code>shop.bakestakes.local</code><button class="btn" data-copy="shop.bakestakes.local" aria-label="Copy store domain">${icon('copy',16)} Copy</button></div><div class="setting-line"><span><strong>Domain configuration</strong><small>Connect a custom domain from your production domain service.</small></span><span class="tag">NOT CHECKED</span></div><div class="setting-line"><span><strong>SSL certificate</strong><small>Managed through your ingress or hosting setup.</small></span><span class="tag">NOT CHECKED</span></div><button class="btn dark" style="margin-top:24px" data-toast="Connect domain is a design-only action.">Connect a domain ${icon('arrowRight',16)}</button></div>
  <div class="small-panel"><span class="panel-eyebrow">THE SHORTCUT</span><h3>See it live.</h3><p>Open the customer-facing storefront in a separate browser tab.</p><button class="btn accent" style="margin-top:15px" data-nav="storefront">Open storefront ${icon('arrowUpRight',16)}</button></div></div></section>`}
function paymentsPage(){return `<section class="workspace">${staticHeading('SETUP / 02','Get','paid.','One place to configure payment methods and keep financial settings organized.')}
  <div class="info-layout"><div class="big-panel"><span class="panel-eyebrow">PAYMENT SETTINGS / CONCEPT</span><h3>Payments, simplified.</h3><p>Choose your setup from the existing Payments page. These controls illustrate the interaction without connecting to a provider.</p>
    <div class="setting-line"><span><strong>Online payments</strong><small>Allow customers to pay at checkout.</small></span><button class="toggle" role="switch" aria-label="Online payments" aria-checked="true" data-toggle></button></div>
    <div class="setting-line"><span><strong>Cash on delivery</strong><small>Offer pay-on-delivery when supported by your checkout.</small></span><button class="toggle" role="switch" aria-label="Cash on delivery" aria-checked="false" data-toggle></button></div>
    <div class="setting-line"><span><strong>Payment provider</strong><small>Configured in your backend's payments integration.</small></span><span class="tag">NOT CONNECTED IN DEMO</span></div>
    <button class="btn dark" style="margin-top:27px" data-toast="Demo controls only. No payment settings were changed.">Review settings ${icon('arrowRight',16)}</button></div>
    <div class="small-panel"><span class="panel-eyebrow">REMINDER</span><h3>Keep it secure.</h3><p>Never store gateway secret keys in client-side HTML. Production payment configuration belongs on your authenticated backend.</p>${icon('wallet',55,1)}</div></div></section>`}
function helpPage(){return `<section class="workspace">${staticHeading('SUPPORT / 03','Here to','help.','Everything you need to keep building and growing with Shopendo.')}
  <div class="info-layout"><div class="big-panel"><span class="panel-eyebrow">HELP CENTER / QUICK ANSWERS</span><h3>What can we help with?</h3><div class="faq">
  <details><summary>Where do I manage products and orders?</summary><p>Open <strong>Manage store</strong> to enter your embedded Medusa Admin. Commerce operations belong there, not on this launcher.</p></details>
  <details><summary>Where do I edit my storefront?</summary><p>Use <strong>Edit website</strong> to enter Payload CMS within the Shopendo shell.</p></details>
  <details><summary>How can I open sales reports?</summary><p>Choose <strong>Sales reports</strong> to open the integrated Recharts + shadcn reporting application.</p></details>
  <details><summary>Can I switch between workspaces quickly?</summary><p>Yes. Use the left navigation, your open-workspace tabs, or Ctrl/⌘ + K to search for any destination.</p></details></div></div>
  <div class="small-panel"><span class="panel-eyebrow">YOUR PLAN / DEMO</span><div class="plan-ticket"><div class="mono">SHOPENDO / YOUR PLAN</div><div class="big">Built for<br>what's next.</div><p style="color:#384833">Your plan details will appear here once connected to billing.</p></div><button class="btn" style="margin-top:16px;width:100%" data-toast="Plan management is not connected in this prototype.">Manage plan ${icon('arrowRight',16)}</button></div></div></section>`}
function settingsPage(){return `<section class="workspace">${staticHeading('PREFERENCES / 04','Your','space.','Adjust how you work. Your Shopendo experience should feel like yours.')}
  <div class="info-layout"><div class="big-panel"><span class="panel-eyebrow">PERSONAL PREFERENCES</span><h3>Make yourself at home.</h3><div class="form-group"><label for="setting-name">Display name</label><input id="setting-name" placeholder="Your name" autocomplete="name" /></div><div class="form-group"><label for="setting-email">Email address</label><input type="email" id="setting-email" placeholder="you@yourstore.com" autocomplete="email" /></div><div class="setting-line"><span><strong>Workspace theme</strong><small>Your light or dark preference is saved in this browser.</small></span><button class="btn" data-action="theme">${icon(theme==='dark'?'sun':'moon',16)} Switch theme</button></div><button class="btn dark" style="margin-top:26px" data-toast="Prototype only: account changes were not saved.">Save preferences ${icon('arrowRight',16)}</button></div><div class="small-panel"><span class="panel-eyebrow">STORE CONTEXT</span><h3>BakeStakes</h3><p>You're viewing the design prototype of a merchant workspace. Authentication and account persistence remain in your existing application.</p><div class="store-avatar" style="width:74px;height:74px;font-size:46px;margin-top:30px">b.</div></div></div></section>`}
function render(){
 sidebar();mobileNav();renderTabs();
 document.querySelector('#content').classList.toggle('native-mode',!!appMeta[active]);
 const item=items.find(x=>x.id===active)||items[0];document.querySelector('#crumb-current').textContent=active==='home'?'WORKDESK':item.name.toUpperCase();
 document.querySelector('#search-caption').innerHTML=`${icon('search',16)} <span>Jump to anything...</span>`;document.querySelector('#notify-icon').innerHTML=icon('bell',18);
 let content=active==='home'?dashboard():appMeta[active]?workspaceApp(active):active==='domain'?domainPage():active==='payments'?paymentsPage():active==='help'?helpPage():settingsPage();
 document.querySelector('#content').innerHTML=content;
 applyTheme(theme);
}
function closeTab(id){openTabs=openTabs.filter(x=>x!==id);if(active===id)navigate(openTabs.at(-1)||'home');else render()}
function showCommand(initial=''){
  searchIndex=0;
  document.querySelector('#modal-root').innerHTML=`<div class="overlay" id="command-overlay"><div class="command" role="dialog" aria-modal="true" aria-label="Navigate Shopendo"><div class="command-search">${icon('search',22)}<input id="command-input" placeholder="Where would you like to go?" autocomplete="off" spellcheck="false" aria-label="Search destinations"/><span class="escape-key">ESC</span></div><div class="command-results" id="command-results"></div><div class="command-footer"><span>↑ ↓ TO NAVIGATE &nbsp; ↵ TO OPEN</span><span>SHOPENDO / QUICK ACCESS</span></div></div></div>`;
  const inp=document.querySelector('#command-input');inp.value=initial;inp.focus();filterCommand(initial);inp.addEventListener('input',()=>{searchIndex=0;filterCommand(inp.value)});
  inp.addEventListener('keydown',e=>{const list=[...document.querySelectorAll('[data-command-nav]')];if(e.key==='ArrowDown'){e.preventDefault();searchIndex=Math.min(searchIndex+1,list.length-1);markCommand()}if(e.key==='ArrowUp'){e.preventDefault();searchIndex=Math.max(0,searchIndex-1);markCommand()}if(e.key==='Enter'&&list.length){e.preventDefault();closeCommand();navigate(list[searchIndex].dataset.commandNav)}})
}
function filterCommand(q){const filtered=items.filter(x=>`${x.name} ${x.desc}`.toLowerCase().includes(q.toLowerCase()));document.querySelector('#command-results').innerHTML=filtered.length?filtered.map((x,i)=>`<button class="command-result ${i===searchIndex?'active':''}" data-command-nav="${x.id}"><span class="result-icon">${icon(x.icon,18)}</span><span class="result-info"><strong>${x.name}</strong><small>${x.desc}</small></span>${icon(x.external?'arrowUpRight':'arrowRight',16)}</button>`).join(''):`<div class="command-empty">No matching workspaces. Try “website”, “store” or “payments”.</div>`;searchIndex=Math.min(searchIndex,Math.max(0,filtered.length-1))}
function markCommand(){document.querySelectorAll('[data-command-nav]').forEach((el,i)=>el.classList.toggle('active',i===searchIndex));document.querySelectorAll('[data-command-nav]')[searchIndex]?.scrollIntoView({block:'nearest'})}
function closeCommand(){document.querySelector('#modal-root').innerHTML=''}
document.addEventListener('click',e=>{
 const close=e.target.closest('[data-close-tab]');if(close){e.stopPropagation();closeTab(close.dataset.closeTab);return}
 const nav=e.target.closest('[data-nav]');if(nav){if(nav.dataset.nav==='more'){showCommand();return}navigate(nav.dataset.nav);return}
 const command=e.target.closest('[data-command-nav]');if(command){closeCommand();navigate(command.dataset.commandNav);return}
 const sw=e.target.closest('[data-theme-switch]');if(sw){applyTheme(sw.dataset.themeSwitch);return}
 const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='command')showCommand();else if(a==='theme')applyTheme(theme==='dark'?'light':'dark');else if(a==='profile')navigate('settings');else if(a==='notifications')toast('No demo notifications. Your notification system plugs in here.');else if(a==='store')toast('BakeStakes is the current example store.');return}
 const medusa=e.target.closest('[data-medusa-section]');if(medusa){medusaSection=medusa.dataset.medusaSection;render();return}
 const productFilter=e.target.closest('[data-product-filter]');if(productFilter){medusaFilter=productFilter.dataset.productFilter;render();return}
 const demoProduct=e.target.closest('[data-demo-product]');if(demoProduct){openProductSheet(demoProduct.dataset.demoProduct);return}
 const drawer=e.target.closest('[data-drawer]');if(drawer){openProductSheet();return}
 const sheetClose=e.target.closest('[data-close-sheet]');if(sheetClose){document.querySelector('#modal-root').innerHTML='';return}
 if(e.target.matches('[data-sheet-scrim]')){document.querySelector('#modal-root').innerHTML='';return}
 const payloadSection=e.target.closest('[data-payload-section]');if(payloadSection){payloadCollection=payloadSection.dataset.payloadSection;render();return}
 const payloadBlockEl=e.target.closest('[data-payload-block]');if(payloadBlockEl){payloadBlock=payloadBlockEl.dataset.payloadBlock;render();return}
 const publish=e.target.closest('[data-publish]');if(publish){payloadPublished=true;render();toast('Prototype status updated. No content was published to Payload.');return}
 const report=e.target.closest('[data-report-range]');if(report){reportRange=report.dataset.reportRange;render();return}
 const copy=e.target.closest('[data-copy]');if(copy){navigator.clipboard?.writeText(copy.dataset.copy).then(()=>toast('Store domain copied.'),()=>toast('Copy shop.bakestakes.local manually.'));return}
 const tog=e.target.closest('[data-toggle]');if(tog){tog.setAttribute('aria-checked',tog.getAttribute('aria-checked')==='true'?'false':'true');toast('Demo preview only — no payment configuration changed.');return}
 const msg=e.target.closest('[data-toast]');if(msg){toast(msg.dataset.toast);return}
 if(e.target.id==='command-overlay')closeCommand();
});
document.addEventListener('input',e=>{
 if(e.target.id==='product-search'){
   medusaSearch=e.target.value;
   const rows=document.querySelector('#product-rows');if(rows)rows.innerHTML=medusaRows();
 }
 if(e.target.matches('[data-payload-text]')){
   const key=e.target.dataset.payloadText;payloadState[key]=e.target.value;
   if(key==='headline'){const el=document.querySelector('#preview-title');if(el)el.textContent=payloadState.headline;}
   if(key==='description'){const el=document.querySelector('#preview-description');if(el)el.textContent=payloadState.description;}
   if(key==='button'){const el=document.querySelector('#preview-button');if(el)el.textContent=payloadState.button+' ↗';}
   if(payloadPublished){payloadPublished=false;const status=document.querySelector('#publish-status');if(status){status.className='state-pill warning';status.textContent='Draft';}}
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='demo-product-form')return;
 e.preventDefault();
 const name=document.querySelector('#demo-product-name').value.trim();
 const sku=document.querySelector('#demo-product-sku').value.trim();
 const price=Number(document.querySelector('#demo-product-price').value);
 if(!name||!sku||!(price>0))return;
 const existing=demoProducts.find(x=>x.name.toLowerCase()===name.toLowerCase());
 if(existing){existing.sku=sku;existing.price='₹'+price.toLocaleString('en-IN');}
 else demoProducts.unshift({name,sku,price:'₹'+price.toLocaleString('en-IN'),status:'Draft',stock:0,art:'🧁',color:'#e1dbc8'});
 document.querySelector('#modal-root').innerHTML='';medusaFilter='all';medusaSearch='';render();toast('Saved in prototype only — not in Medusa.');
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const input=document.querySelector('#command-input');if(input)closeCommand();else showCommand()}else if(e.key==='Escape'){closeCommand()}else if(e.key==='Enter'&&document.activeElement?.hasAttribute('data-nav'))navigate(document.activeElement.dataset.nav)});
window.addEventListener('popstate',()=>{active=items.some(x=>x.id===location.hash.slice(1))?location.hash.slice(1):'home';if(!openTabs.includes(active))openTabs.push(active);render()});
render();
</script>
